version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_go
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: primeiro_projeto_go
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: